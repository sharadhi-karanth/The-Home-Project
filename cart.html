<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .cart-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #007b5e;
            font-size: 18px;
            font-weight: bold;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        /* Cart item */

        .cart-item {
            background-color: white;
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .cart-item img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .cart-details p {
            margin: 8px 0;
            font-size: 16px;
        }

        .quantity {
            font-weight: bold;
        }

        .item-total {
            font-size: 18px;
            font-weight: bold;
            color: #007b5e;
        }

        /* Buttons */

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            color: white;
        }

        .remove-button {
            background-color: #dc3545;
        }

        .remove-button:hover {
            background-color: #c82333;
        }

        .buy-button {
            background-color: #ff9800;
        }

        .buy-button:hover {
            background-color: #e68900;
        }

        /* Cart summary */

        .cart-summary {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
            text-align: right;
        }

        .cart-summary h2 {
            margin-bottom: 20px;
        }

        .grand-total {
            font-size: 24px;
            font-weight: bold;
            color: #007b5e;
            margin-bottom: 20px;
        }

        .buy-all-button {
            background-color: #007b5e;
            font-size: 18px;
            padding: 12px 25px;
        }

        .buy-all-button:hover {
            background-color: #005f46;
        }

        /* Empty cart */

        .empty-cart {
            background-color: white;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #007b5e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .empty-cart a:hover {
            background-color: #005f46;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-item img {
                width: 100%;
                height: 250px;
            }

            .button-container {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .cart-summary {
                text-align: center;
            }
        }

    </style>

</head>

<body>

    <div class="cart-container">

        <a href="products.html" class="back-button">
            ← Continue Shopping
        </a>

        <h1>🛒 My Cart</h1>

        <div id="cartItems"></div>

        <div id="cartSummary"></div>

    </div>


    <script>

        // Get cart from localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];


        // Display cart
        function displayCart() {

            const cartItemsContainer =
                document.getElementById("cartItems");

            const cartSummary =
                document.getElementById("cartSummary");


            // Empty cart
            if (cart.length === 0) {

                cartItemsContainer.innerHTML = `
                    <div class="empty-cart">

                        <h2>Your cart is empty 🛒</h2>

                        <p>
                            You haven't added any products to your cart yet.
                        </p>

                        <a href="products.html">
                            Start Shopping
                        </a>

                    </div>
                `;

                cartSummary.innerHTML = "";

                return;
            }


            cartItemsContainer.innerHTML = "";

            let grandTotal = 0;


            cart.forEach((item, index) => {

                let itemTotal = 0;

                let quantityText = "";


                // Arecanut / Paddy
                if (item.unit === "kg") {

                    // Quantity is stored in grams
                    itemTotal =
                        (item.quantity / 1000) * item.price;

                    quantityText =
                        item.quantity + " grams";

                }


                // Coconut
                else {

                    itemTotal =
                        item.quantity * item.price;

                    quantityText =
                        item.quantity + " piece(s)";
                }


                grandTotal += itemTotal;


                const cartItem = document.createElement("div");

                cartItem.className = "cart-item";


                cartItem.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                        onerror="this.style.display='none';"
                    >

                    <div class="cart-details">

                        <h2>${item.name}</h2>

                        <p>
                            <strong>Quantity:</strong>
                            <span class="quantity">
                                ${quantityText}
                            </span>
                        </p>

                        <p>
                            <strong>Price:</strong>
                            INR ${item.price}
                            ${item.unit === "kg"
                                ? " per kg"
                                : " per piece"}
                        </p>

                        <p class="item-total">
                            Item Total:
                            INR ${itemTotal.toFixed(2)}
                        </p>


                        <div class="button-container">

                            <button
                                class="remove-button"
                                onclick="removeFromCart(${index})">
                                Remove from Cart
                            </button>

                            <button
                                class="buy-button"
                                onclick="buyNow(${index})">
                                Buy Now
                            </button>

                        </div>

                    </div>
                `;


                cartItemsContainer.appendChild(cartItem);

            });


            // Cart total
            cartSummary.innerHTML = `

                <div class="cart-summary">

                    <h2>Cart Summary</h2>

                    <div class="grand-total">

                        Grand Total:
                        INR ${grandTotal.toFixed(2)}

                    </div>

                    <button
                        class="buy-all-button"
                        onclick="buyAll()">

                        Buy All

                    </button>

                </div>

            `;

        }


        // Remove item from cart
        function removeFromCart(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();

        }


        // Buy one item
   function buyNow(index) {

    // Check if customer is logged in
    const customer =
        JSON.parse(localStorage.getItem("customer"));

    if (!customer) {

        alert(
            "Please enter your customer details before placing an order."
        );

        window.location.href = "login.html";

        return;
    }


    const item = cart[index];


    let itemTotal = 0;


    if (item.unit === "kg") {

        // Quantity is stored in grams
        itemTotal =
            (item.quantity / 1000) *
            item.price;

    } else {

        // Coconut
        itemTotal =
            item.quantity *
            item.price;
    }


    alert(
        "Order ready!\n\n" +
        "Customer: " + customer.fullName +
        "\nProduct: " + item.name +
        "\nAmount: INR " + itemTotal.toFixed(2)
    );


    // SQL order processing will be added in the next step.
}


        // Buy everything
      function buyAll() {

    // Check if customer is logged in
    const customer =
        JSON.parse(localStorage.getItem("customer"));

    if (!customer) {

        alert(
            "Please enter your customer details before placing an order."
        );

        window.location.href = "login.html";

        return;
    }

        if (item.unit === "kg") {

            // Quantity is stored in grams
            grandTotal +=

        } else {

            // Coconut
            grandTotal +=
                item.quantity *
                item.price;
        }

    });


    alert(
        "Order ready!\n\n" +
        "Customer: " + customer.fullName +
        "\nTotal Amount: INR " +

    );


    // SQL order processing will be added in the next step.
}


        // Load cart when page opens
        displayCart();

    </script>

</body>

</html>
