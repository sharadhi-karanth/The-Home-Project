<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Product Details</title>

<link rel="stylesheet" href="styleinone.css">
```

</head>

<body>

```
<div class="product-container">


    <!-- BACK BUTTON -->

    <a href="products.html"
       class="back-button">

        ← Back to Products

    </a>



    <div class="product-card">


        <!-- ===================== -->
        <!-- PRODUCT IMAGE -->
        <!-- ===================== -->

        <div class="product-image-section">

            <img
                id="productImage"
                src=""
                alt="Product"
            >

        </div>



        <!-- ===================== -->
        <!-- PRODUCT DETAILS -->
        <!-- ===================== -->

        <div class="product-details">


            <h1 id="productName">
                Product Name
            </h1>


            <p id="productStock"
               class="stock">
            </p>


            <p id="productPrice"
               class="price">
            </p>


            <hr>



            <!-- ===================== -->
            <!-- QUANTITY -->
            <!-- ===================== -->

            <label for="quantity" id="quantityLabel">

                Quantity:

            </label>


            <div class="quantity-container">


                <button
                    type="button"
                    onclick="decreaseQuantity()">

                    −

                </button>


                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    step="1"
                    oninput="calculateTotal()"
                >


                <button
                    type="button"
                    onclick="increaseQuantity()">

                    +

                </button>


            </div>


            <p id="unitText"></p>



            <!-- ===================== -->
            <!-- TOTAL PRICE -->
            <!-- ===================== -->

            <div class="total-section">


                <span>
                    Total Price:
                </span>


                <strong id="totalPrice">

                    INR 0

                </strong>


            </div>



            <!-- ===================== -->
            <!-- ADD TO CART -->
            <!-- ===================== -->

            <button
                class="cart-button"
                onclick="addToCart()">

                Add to Cart

            </button>



            <!-- ===================== -->
            <!-- ORDER NOW -->
            <!-- ===================== -->

            <button
                class="buy-button"
                onclick="buyNow()">

                Order Now

            </button>

            <br><br>

                <a href="cart.html" class="view-cart-button">
                    🛒 View Cart
                </a>


        </div>


    </div>


</div>
```

<script>


/* =====================================================
   PRODUCT INFORMATION
   ===================================================== */

const productImages = {

    areca:
        "images/boiled-areca-nut.jpg",

    paddy:
        "images/pile-red-rice-uncooked-isolated-260nw-1090723364.webp",

    coconut:
        "images/Sure_ways_to_keep_the_coconut_tree_healthy.jpg"

};

let products = {};


/* =====================================================
   GET PRODUCT FROM URL
   ===================================================== */

const urlParams =
    new URLSearchParams(window.location.search);


const productID =
    urlParams.get("product");

    async function loadProduct() {

    try {

        const response =
            await fetch("http://localhost:3000/products");

        if (!response.ok) {
            throw new Error("Failed to fetch products");
        }

        const data =
            await response.json();

        data.forEach(product => {

            let id;

            if (product.ProductName === "Areca Nut (Adike)") {
                id = "areca";
            }
            else if (product.ProductName === "Paddy (Akki)") {
                id = "paddy";
            }
            else if (product.ProductName === "Coconut (Tengina Kai)") {
                id = "coconut";
            }

            if (id) {

                products[id] = {

                    name: product.ProductName,

                    image: productImages[id],

                    stock: product.Stock,

                    price: product.Price,

                    unit: product.Unit

                };

            }

        });

        displayProduct();

    }
    catch (error) {

        console.error("Error loading products:", error);

        document.body.innerHTML = `
            <h1 style="text-align:center; margin-top:50px;">
                Unable to load product
            </h1>

            <p style="text-align:center;">
                Please make sure the backend server is running.
            </p>
        `;

    }

}



/* =====================================================
   CHECK PRODUCT
   ===================================================== */
function displayProduct() {
if (!products[productID]) {


    document.body.innerHTML = `

        <h1 style="text-align:center; margin-top:50px;">

            Product not found

        </h1>

        <p style="text-align:center;">

            <a href="products.html">

                Go back to products

            </a>

        </p>

    `;


}



/* =====================================================
   DISPLAY PRODUCT
   ===================================================== */

else {


    const product =
        products[productID];


    const quantityInput =
        document.getElementById("quantity");


    const quantityLabel =
        document.getElementById("quantityLabel");



    /* =================================================
       ARECANUT / PADDY
       ================================================= */

    if (product.unit === "kg") {


        /*
            Customer enters quantity in grams.

            Example:

            100 g
            250 g
            500 g
            1000 g
            1500 g
        */

        quantityInput.value = 100;

        quantityInput.min = 1;

        quantityInput.step = 1;

        quantityInput.placeholder =
            "Enter grams";


        quantityLabel.textContent =
            "Quantity (grams):";


        document.getElementById("unitText")
            .textContent =
            "Enter the quantity you need in grams. "
            + "You can enter any whole number of grams.";


        /*
            Display stock clearly in KG.
        */

        document.getElementById("productStock")
            .textContent =
            "Available Stock: "
            + product.stock
            + " kg";


        /*
            Display price clearly per KG.
        */

        document.getElementById("productPrice")
            .textContent =
            "Price: INR "
            + product.price
            + " per kg";

    }



    /* =================================================
       COCONUT
       ================================================= */

    else {


        quantityInput.value = 1;

        quantityInput.min = 1;

        quantityInput.step = 1;


        quantityLabel.textContent =
            "Quantity (pieces):";


        document.getElementById("unitText")
            .textContent =
            "Coconut can only be ordered as whole pieces.";


        /*
            Display stock clearly in PIECES.
        */

        document.getElementById("productStock")
            .textContent =
            "Available Stock: "
            + product.stock
            + " pieces";


        /*
            Display price clearly per PIECE.
        */

        document.getElementById("productPrice")
            .textContent =
            "Price: INR "
            + product.price
            + " per piece";

    }



    /* =================================================
       DISPLAY PRODUCT IMAGE
       ================================================= */

    const productImage =
        document.getElementById("productImage");


    productImage.src =
        product.image;


    productImage.alt =
        product.name;



    /* =================================================
       DISPLAY PRODUCT NAME
       ================================================= */

    document.getElementById("productName")
        .textContent =
        product.name;



    /* =================================================
       CALCULATE INITIAL TOTAL
       ================================================= */

    calculateTotal();

}
}
loadProduct();


/* =====================================================
   INCREASE QUANTITY
   ===================================================== */

function increaseQuantity() {


    const quantityInput =
        document.getElementById("quantity");


    const product =
        products[productID];


    let quantity =
        parseFloat(quantityInput.value);


    if (isNaN(quantity)) {

        quantity = 1;

    }



    /*
        ARECANUT / PADDY

        Increase by 100 grams.
    */

    if (product.unit === "kg") {


        quantity += 100;


        const stockInGrams =
            product.stock * 1000;


        if (quantity > stockInGrams) {

            quantity =
                stockInGrams;

        }

    }



    /*
        COCONUT

        Increase by 1 piece.
    */

    else {


        quantity += 1;


        if (quantity > product.stock) {

            quantity =
                product.stock;

        }

    }



    quantityInput.value =
        quantity;


    calculateTotal();

}



/* =====================================================
   DECREASE QUANTITY
   ===================================================== */

function decreaseQuantity() {


    const quantityInput =
        document.getElementById("quantity");


    const product =
        products[productID];


    let quantity =
        parseFloat(quantityInput.value);


    if (isNaN(quantity)) {

        quantity = 1;

    }



    /*
        ARECANUT / PADDY

        Decrease by 100 grams.
    */

    if (product.unit === "kg") {


        quantity -= 100;


        if (quantity < 1) {

            quantity = 1;

        }

    }



    /*
        COCONUT

        Decrease by 1 piece.
    */

    else {


        quantity -= 1;


        if (quantity < 1) {

            quantity = 1;

        }

    }



    quantityInput.value =
        quantity;


    calculateTotal();

}



/* =====================================================
   CALCULATE TOTAL
   ===================================================== */

function calculateTotal() {


    const product =
        products[productID];


    const quantityInput =
        document.getElementById("quantity");


    let quantity =
        parseFloat(quantityInput.value);



    /* ================================================
       INVALID INPUT
       ================================================ */

    if (
        isNaN(quantity) ||
        quantity <= 0
    ) {

        quantity = 1;

    }



    /* ================================================
       ARECANUT / PADDY
       ================================================ */

    if (product.unit === "kg") {


        /*
            Stock is stored in KG.

            Convert it to grams so we can
            compare it with customer quantity.
        */

        const stockInGrams =
            product.stock * 1000;


        /*
            Don't allow quantity above stock.
        */

        if (quantity > stockInGrams) {

            quantity =
                stockInGrams;

        }


        /*
            Only whole grams allowed.
        */

        quantity =
            Math.floor(quantity);


        quantityInput.value =
            quantity;



        /*
            Convert grams → kilograms.
        */

        const quantityInKg =
            quantity / 1000;



        /*
            Calculate:

            quantity in KG × price per KG
        */

        const total =
            quantityInKg * product.price;



        document.getElementById("totalPrice")
            .textContent =
            "INR "
            + total.toFixed(2);

    }



    /* ================================================
       COCONUT
       ================================================ */

    else {


        /*
            Coconut must always be
            a whole number.
        */

        quantity =
            Math.floor(quantity);


        if (quantity < 1) {

            quantity = 1;

        }


        if (quantity > product.stock) {

            quantity =
                product.stock;

        }


        quantityInput.value =
            quantity;



        /*
            Pieces × price per piece
        */

        const total =
            quantity * product.price;



        document.getElementById("totalPrice")
            .textContent =
            "INR "
            + total.toFixed(2);

    }

}



/* =====================================================
   ADD TO CART
   ===================================================== */

function addToCart() 
{

    const product = products[productID];

    const quantity = parseFloat(
        document.getElementById("quantity").value
    );


    // Check quantity
    if (isNaN(quantity) || quantity <= 0) {

        alert("Please enter a valid quantity.");
        return;

    }


    // Check stock
    if (product.unit === "kg") {

        const stockInGrams = product.stock * 1000;

        if (quantity > stockInGrams) {

            alert(
                "Sorry, only " +
                product.stock +
                " kg is available."
            );

            return;
        }

    } else {

        if (quantity > product.stock) {

            alert(
                "Sorry, only " +
                product.stock +
                " pieces are available."
            );

            return;
        }

    }


    // Get existing cart
    let cart = JSON.parse(
        localStorage.getItem("cart")
    ) || [];


    // Check whether this product is already in cart
    const existingProduct = cart.find(
        item => item.id === productID
    );


    if (existingProduct) {

        // Add the new quantity to existing quantity
        existingProduct.quantity += quantity;

    } else {

        // Add new product
        cart.push({

            id: productID,

            name: product.name,

            image: product.image,

            price: product.price,

            unit: product.unit,

            quantity: quantity

        });

    }


    // Save cart
    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert(
        product.name +
        " added to cart successfully!"
    );

}



   





/* =====================================================
   ORDER NOW
   ===================================================== */

function buyNow() {


    const product =
        products[productID];


    const quantity =
        parseFloat(
            document.getElementById("quantity").value
        );



    /* ================================================
       CHECK QUANTITY
       ================================================ */

    if (
        isNaN(quantity) ||
        quantity <= 0
    ) {


        alert(
            "Please enter a valid quantity."
        );


        return;

    }



    /* ================================================
       ARECANUT / PADDY STOCK CHECK
       ================================================ */

    if (product.unit === "kg") {


        const stockInGrams =
            product.stock * 1000;


        if (quantity > stockInGrams) {


            alert(

                "Sorry, only "
                + product.stock
                + " kg is available."

            );


            return;

        }

    }



    /* ================================================
       COCONUT STOCK CHECK
       ================================================ */

    else {


        if (quantity > product.stock) {


            alert(

                "Sorry, only "
                + product.stock
                + " pieces are available."

            );


            return;

        }

    }



    /* ================================================
       CALCULATE TOTAL
       ================================================ */

    let total;


    if (product.unit === "kg") {


        total =
            (quantity / 1000)
            * product.price;

    }


    else {


        total =
            quantity * product.price;

    }



    /* ================================================
       SHOW ORDER SUMMARY
       ================================================ */

    alert(

        "Order Summary\n\n"

        + product.name

        + "\nQuantity: "
        + quantity
        + " "
        + (
            product.unit === "kg"
            ? "grams"
            : "piece(s)"
        )

        + "\nTotal: INR "
        + total.toFixed(2)

    );

}


</script>

</body>

</html>
