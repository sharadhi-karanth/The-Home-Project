<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

        }


        .login-container {

            background-color: #ffffff;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 0 10px rgba(0, 0, 0, 0.1);

            width: 300px;

        }


        .login-container h2 {

            text-align: center;

            margin-bottom: 20px;

        }


        .login-container label {

            display: block;

            margin-bottom: 5px;

        }


        .login-container input[type="text"],
        .login-container input[type="tel"] {

            width: 100%;

            padding: 10px;

            margin: 8px 0 16px 0;

            border: 1px solid #ccc;

            border-radius: 6px;

            box-sizing: border-box;

        }


        .login-container button {

            width: 100%;

            padding: 10px;

            background-color: #4CAF50;

            border: none;

            color: white;

            font-size: 16px;

            border-radius: 6px;

            cursor: pointer;

        }


        .login-container button:hover {

            background-color: #45a049;

        }

    </style>

</head>


<body>


    <div class="login-container">


        <h2>User Login</h2>


        <!--
            IMPORTANT:
            The form now goes to products.html,
            NOT productsinone.html.
        -->

        <form id="loginForm">


            <!-- FULL NAME -->

            <label for="fullname">
                Full Name
            </label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >



            <!-- ADDRESS -->

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
                placeholder="Enter your address"
                required
            >



            <!-- PHONE -->

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >



            <!-- LOGIN -->

            <button type="submit">
                Login
            </button>


        </form>


    </div>
<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const fullName =
            document.getElementById("fullname").value.trim();


        const address =
            document.getElementById("address").value.trim();


        const phone =
            document.getElementById("phone").value.trim();


        /* =========================================
           SAVE CUSTOMER DETAILS TEMPORARILY
           ========================================= */

        const customer = {

            fullName: fullName,

            address: address,

            phone: phone

        };


        localStorage.setItem(
            "customer",
            JSON.stringify(customer)
        );


        /* =========================================
           GO TO PRODUCTS
           ========================================= */

        window.location.href =
            "products.html";

    });

</script>

</body>

</html>
